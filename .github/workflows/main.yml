name: Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: |
          make test
      - name: Build image & push to ECR
        if: ${{ github.event_name == 'push' }}  # don't deploy branches
        uses: kciter/aws-ecr-action@master
        with:
          access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          repo: dxe/alc-mobile-api
          region: us-west-2
          tags: latest,${{ steps.sha.outputs.short }}
          dockerfile: Dockerfile-prod


  deploy:
    needs: build
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          owner: dxe
          repositories: terraform

      - name: Trigger the deploy
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          gh workflow run deploy-ecs.yml --repo dxe/terraform \
            -f service=alc-mobile-api \
            -f tag="${GITHUB_SHA::7}" \
            -f caller_run_id=${{ github.run_id }}
